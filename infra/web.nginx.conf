# Serves the PWA and proxies the API. TLS ends at Cloudflare + the host router.

# rules.md §4 / MOT-07 R4: no IP addresses in logs. Status, method and path
# only; query strings are dropped too.
log_format rafeeq_noip '$time_iso8601 $request_method $uri $status $body_bytes_sent $request_time';

server {
  listen 80;
  access_log /dev/stdout rafeeq_noip;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 2m;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    proxy_buffering off;   # streamed answers
  }

  # Never cache the app shell or the service worker; hashed assets forever.
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location /fonts/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  location / { try_files $uri $uri/ /index.html; }
}
