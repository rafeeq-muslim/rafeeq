# Serves the PWA and proxies the API. TLS ends at Cloudflare + the host router.

# rules.md §4 / MOT-07 R4: no IP addresses in logs. Status, method and path
# only; query strings are dropped too. The error log of this server is off for
# the same reason (see `error_log` below).
log_format rafeeq_noip '$time_iso8601 $request_method $uri $status $body_bytes_sent $request_time';

# Security review 2026-10-07 (A-L3): one general ceiling per visitor address
# for /api/, under the per-route limits of the backend, so no single address
# can flood the cheap public routes of the one backend process. Keyed by the
# address restored from X-Real-IP below (the limit module runs after it); the
# address lives in this zone's memory only. Generous on purpose: a first open
# sends about 500 calls in a burst (the offline warm-up keeps every adhkar
# chapter and the verses they quote, 4 at a time, on top of the start-up
# calls), a full Quran text download about 215, and a class behind one router
# opens together: 30 devices are about 15,000 calls in the first minute,
# inside 4000 at once + 200 a second. Nothing under /api/ is excluded.
limit_req_zone $binary_remote_addr zone=rafeeq_api:10m rate=200r/s;

server {
  listen 80;
  # The only client is the host router (port bound to 127.0.0.1), which sets
  # X-Real-IP to the visitor's address. Restore it so per-address rate limits
  # (login, codes, events) apply per visitor, not to everyone at once. The
  # address is never logged (log format above) nor stored.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Real-IP;
  access_log /dev/stdout rafeeq_noip;
  # nginx adds the visitor's address to every error line about a connection or
  # a request, at every level, and that cannot be configured away. So this
  # server writes none: a failed request still shows in the access log above
  # (status, path, time; 502/504 when the backend is down or slow). nginx's own
  # log (start, reload, a configuration mistake, a worker that died) is set in
  # the image's nginx.conf, carries no address and is left as it is.
  error_log /dev/null emerg;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 2m;
  server_tokens off;
  absolute_redirect off;  # PLT-10 redirects stay relative (TLS ends before this server)

  include /etc/nginx/snippets/security-headers.inc;

  location /api/ {
    limit_req zone=rafeeq_api burst=4000 nodelay;
    limit_req_status 429;
    # A refusal is logged at this level with the visitor's address; this
    # server's error log is off and nginx's own starts at `notice`, so nothing
    # is written either way (no addresses in logs).
    limit_req_log_level info;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    proxy_buffering off;   # streamed answers
  }

  # Never cache the app shell or the service worker; hashed assets forever.
  location = /sw.js { add_header Cache-Control "no-cache"; include /etc/nginx/snippets/security-headers.inc; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; include /etc/nginx/snippets/security-headers.inc; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; include /etc/nginx/snippets/security-headers.inc; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/snippets/security-headers.inc; try_files $uri =404; }
  location /fonts/ { add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/snippets/security-headers.inc; try_files $uri =404; }

  # PLT-10 R1/R2: the landing page is at /, the app (one index.html) under /app/.
  # /landing/ keeps working (old QR codes, and an open old app sends first
  # visitors there until its service worker updates); its canonical URL is /.
  location = / { add_header Cache-Control "no-cache"; include /etc/nginx/snippets/security-headers.inc; try_files /landing/index.html =404; }
  location = /landing { include /etc/nginx/snippets/security-headers.inc; return 301 /$is_args$args; }
  location /landing/ { include /etc/nginx/snippets/security-headers.inc; try_files $uri $uri/ =404; }
  location = /app { include /etc/nginx/snippets/security-headers.inc; return 301 /app/$is_args$args; }
  location /app/ { include /etc/nginx/snippets/security-headers.inc; try_files $uri /index.html; }
  # Links made before the move (bookmarks, printed QR codes, old pushes) keep working.
  location ~ ^/(welcome|privacy|design|learn|next|ask|mentor|me|practice|discover|guide|inbox|review-desk|referrals|team|admin|org|downloads|mentor-applications|mentor-apply)(/.*)?$ { include /etc/nginx/snippets/security-headers.inc; return 301 /app$request_uri; }

  location / { include /etc/nginx/snippets/security-headers.inc; try_files $uri =404; }
}
