# Production on this server: `docker compose -p rafeeq -f infra/compose.prod.yml up -d --build`
# Secrets live only in ~/.config/rafeeq/secrets.env on the server (never in git).
# Server paths are taken from the account that runs compose: RAFEEQ_CONFIG_DIR
# (default $HOME/.config/rafeeq) and RAFEEQ_CORPUS_DIR (default
# $HOME/.local/share/rafeeq/corpus). Run compose as the deploy account, not with
# sudo: another account's $HOME would point at missing files.
name: rafeeq
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # Container logs are capped: they can hold personal data and would otherwise grow without limit.
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      POSTGRES_USER: rafeeq
      POSTGRES_DB: rafeeq
    env_file: ${RAFEEQ_CONFIG_DIR:-${HOME}/.config/rafeeq}/secrets.env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rafeeq -d rafeeq"]
      interval: 5s
      retries: 20
  backend:
    image: rafeeq-backend:latest
    build: { context: .., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    logging: *logging
    env_file: ${RAFEEQ_CONFIG_DIR:-${HOME}/.config/rafeeq}/secrets.env
    environment:
      ENV: production
      PUBLIC_URL: https://rafeeq.nan.sa
      CORPUS_DIR: /srv/corpus
    # KNW-02 source files: outside the public repo, read-only in the container.
    volumes:
      - ${RAFEEQ_CORPUS_DIR:-${HOME}/.local/share/rafeeq/corpus}:/srv/corpus:ro
    depends_on: { db: { condition: service_healthy } }
    command: ["sh", "-c", "export DATABASE_URL=postgresql+asyncpg://rafeeq:$${POSTGRES_PASSWORD}@db:5432/rafeeq && alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*' --no-access-log"]
  web:
    image: rafeeq-web:latest
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY:-}
        VITE_BUILD_ID: ${VITE_BUILD_ID:-dev}
    restart: unless-stopped
    logging: *logging
    ports: ["127.0.0.1:5380:80"]
    depends_on: [backend]
volumes:
  pgdata:
