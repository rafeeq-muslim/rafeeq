# Wakes the Claude build session when teammates change the repo: one line
# per event is appended to a log on this server, which the session watches.
# Safe on the self-hosted runner: nothing is checked out or executed from the
# change, PRs use pull_request_target (workflow always from main), and
# untrusted text (titles, branch names) only travels through env variables.
name: Notify build session
on:
  push:
    branches-ignore: [gh-pages]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
permissions: {}
# No concurrency group: GitHub keeps only one pending run per group and
# cancels the older one, which dropped events while CI or a deploy held the
# runners. Each run appends a single short line, so runs need no serialising.
jobs:
  notify:
    # Claude's own commits carry a Claude-Session trailer: no need to wake for them.
    if: ${{ github.event_name == 'pull_request_target' || !contains(github.event.head_commit.message, 'Claude-Session:') }}
    runs-on: [self-hosted, rafeeq]
    timeout-minutes: 2
    steps:
      - name: Append event to the session log
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          SHA: ${{ github.event.after || github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$HOME/.local/state/rafeeq"
          python3 - <<'PY' >> "$HOME/.local/state/rafeeq/github-events.log"
          import json, os, datetime
          e = {k.lower(): os.environ.get(k, "") for k in ("EVENT", "REF", "ACTOR", "PR_NUMBER", "PR_TITLE", "PR_BRANCH", "SHA")}
          e["commit"] = os.environ.get("COMMIT_MSG", "").splitlines()[0][:200] if os.environ.get("COMMIT_MSG") else ""
          e["at"] = datetime.datetime.now(datetime.UTC).isoformat(timespec="seconds")
          print(json.dumps(e, ensure_ascii=False))
          PY
