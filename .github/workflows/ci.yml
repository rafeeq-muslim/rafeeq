name: CI
# Runs on the team's self-hosted runner: GitHub-hosted runners are not
# available to this private organisation. The repo is private, so only
# members can open pull requests that reach the runner.
# On main and on pull requests only: a pushed branch with a PR was tested
# twice (push and pull_request), which kept both shared runners busy.
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  backend:
    runs-on: [self-hosted, rafeeq]
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: rafeeq, POSTGRES_PASSWORD: rafeeq_dev, POSTGRES_DB: rafeeq_test }
        ports: ["127.0.0.1:5443:5432"]  # 5442 is the local dev database on this host
        options: >-
          --health-cmd "pg_isready -U rafeeq" --health-interval 5s --health-retries 20
    defaults: { run: { working-directory: backend } }
    env:
      DATABASE_URL: postgresql+asyncpg://rafeeq:rafeeq_dev@127.0.0.1:5443/rafeeq_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
  frontend:
    runs-on: [self-hosted, rafeeq]
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc -b
      - run: bash scripts/check-design.sh
      - run: npx vitest run
      - run: npm run build:app
