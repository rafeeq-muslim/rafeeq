# Production deploy on this server (no staging, owner's decision). Runs only
# on pushes to main or by hand, never on pull requests, so code from forks
# never reaches the self-hosted runner.
name: Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: deploy-production, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: [self-hosted, rafeeq]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Deploy
        run: bash infra/scripts/deploy.sh
