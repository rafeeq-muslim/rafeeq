# Production deploy on this server (no staging, owner's decision). Runs only
# on pushes to main or by hand, never on pull requests, so code from forks
# never reaches the self-hosted runner.
name: Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: deploy-production, cancel-in-progress: false }
jobs:
  deploy:
    # Security review #4: production deploys only ever come from main.
    if: github.ref == 'refs/heads/main'
    # Its own runner (label rafeeq-deploy, nothing else uses it), so a
    # deploy starts at once instead of queueing behind CI on the shared ones.
    runs-on: [self-hosted, rafeeq-deploy]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Deploy
        run: bash infra/scripts/deploy.sh
