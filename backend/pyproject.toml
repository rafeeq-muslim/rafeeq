[project]
name = "rafeeq-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "cryptography>=46",
    "fastapi[standard]>=0.115",
    "httpx>=0.28.1",
    "orjson>=3.12.0",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.6",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "pywebpush>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# E501: long lines are left to the formatter's judgement (rules, SQL, test data).
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]
